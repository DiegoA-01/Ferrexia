# Cabeceras de seguridad. Se incluyen en cada location porque nginx NO hereda add_header si el location define uno propio.
#
# CSP: la aplicación solo carga código de su propio origen. Los únicos externos son las fuentes de Google
# (Inter y Material Symbols): hoja de estilos desde fonts.googleapis.com y archivos desde fonts.gstatic.com.
# Spec 031: el anti-bot del enlace de cotización (Cloudflare Turnstile) carga su script y su marco desde
# challenges.cloudflare.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://challenges.cloudflare.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS no va aquí: este nginx habla HTTP. Se activa en el proxy que termina el HTTPS (ver DOCKER.md).
